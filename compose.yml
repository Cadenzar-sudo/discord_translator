services:
  server:
    build:
      context: ./server
    image: translator-server
    init: true
    stop_grace_period: 25s
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # config holds tokens: lives outside git, created from server/config.json
      - ./docker-data/config.json:/data/config.json
      # point TRANSLATOR_MODELS at an existing model dir to skip the
      # first-run HuggingFace download (set in start_bot.bat / environment)
      - ${TRANSLATOR_MODELS:-./server/models}:/models

  voice-bot:
    build:
      context: ./sidecar
    image: translator-voice-bot
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on:
      - server
    volumes:
      - ./docker-data/config.json:/data/config.json:ro
    # health probe, local debugging only
    ports:
      - "127.0.0.1:8766:8766"

  # Optional internet exposure for remote viewers (works with BOTH versions:
  # bot and loopback). Profile-gated: plain `docker compose up -d` never
  # starts it — start_tunnel.bat does. The token comes from
  # docker-data/config.json ("cloudflare" -> "tunnel_token"), copied into
  # .env by start_tunnel.bat. The tunnel's public hostname must point at
  # http://server:8765 (set once in the Zero Trust dashboard) — cloudflared
  # resolves the `server` service over the compose network, so this service
  # publishes no ports.
  cloudflared:
    image: cloudflare/cloudflared:latest
    init: true
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - server
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
